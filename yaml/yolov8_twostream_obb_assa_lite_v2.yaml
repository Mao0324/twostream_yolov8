# Ultralytics YOLO 🚀, AGPL-3.0 license
# YOLOv8 two-stream OBB with ASSARIFusion_v2 (+per-channel scale, +post-concat DWConv) and ASSAAdd.
#
# ============================================================================
# 消融配置: ASSARIFusion_v2（建议2+5）
# ============================================================================
#
# 【新增机制】
#   在原始 ASSARIFusion 基础上增加两个轻量增强：
#
#   (1) Per-Channel Scale（建议5）
#       原始:  scale_rgb = nn.Parameter(torch.ones(1) * 1e-3)   # 标量
#       改进:  scale_rgb = nn.Parameter(torch.ones(c, 1, 1) * 1e-3)  # 逐通道
#
#       动机: 不同通道对跨模态注意力的依赖程度不同（如纹理 vs 轮廓 vs 背景），
#             标量 scale 强迫所有通道共享同一个修正幅度，逐通道 scale 允许
#             每个通道独立调节从 IR/RGB 获取的信息量。
#
#       实现: 将 scalar parameter 替换为 shape=(c, 1, 1) 的 parameter，
#             广播到 [B, C, H, W]，与 delta 逐通道相乘。
#             参数量: 2×c per fusion stage，总共约 1.8K（可忽略）。
#
#   (2) Post-Concat Depthwise Conv（建议2）
#       原始:  raw output = torch.cat([rgb_fused, ir_fused], dim=1)
#             拼接后直接返回，无联合处理
#
#       改进:  output = cat + post_scale * post_dw(cat)
#             其中 post_dw = Conv2d(2c, 2c, 3, p=1, groups=2c) 深度可分离
#             post_scale 初始值 1e-3，训练中学习
#
#       动机: 交叉注意力只做通道空间的 QK 交互（reshape 为 [B,heads,dim,HW]），
#             丢失了 2D 空间结构信息。DWConv 3×3 引入轻量空间上下文，
#             让拼接后的联合特征在局部空间上平滑交互。
#             残差连接 + 极小 scale 初始化确保不破坏原有训练好的特征。
#
#       实现: 单个深度卷积 + 可学习 scale，残差连接。
#             参数量: 9×2c per fusion stage，总共约 18K。
#
# 【预期效果】
#   - Per-channel scale: 让模型自主分配不同通道的跨模态权重，预期小幅提升
#   - Post-DWConv: 弥补 cross-channel attention 的空间盲区，提升定位精度
#   - 两者结合预期在 mAP50 上额外提升 0.2~0.5%
#
# 【总参数量变化】
#   +~18K（相对于约 11M 的总参数量，可忽略不计）
#
# ============================================================================

nc: 7
scales:
  #n: [0.33, 0.25, 1024]
  s: [0.33, 0.50, 1024]
  m: [0.67, 0.75, 768]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.25, 512]
scale: s

backbone:
  # ------------------------------------------------------------------
  # RGB 支路
  # ------------------------------------------------------------------
  - [-1, 1, Conv, [64, 3, 2]]     # 0-P1/2   RGB Conv 下采样
  - [-1, 1, Conv, [128, 3, 2]]    # 1-P2/4   RGB Conv 下采样
  - [-1, 3, C2f, [128, True]]     # 2        RGB C2f
  - [-1, 1, Conv, [256, 3, 2]]    # 3-P3/8   RGB Conv 下采样（第1个多尺度点）

  # ------------------------------------------------------------------
  # IR 支路（from=-4 触发支路切换，从 layer 4 开始使用 IR 输入）
  # ------------------------------------------------------------------
  - [-4, 1, Conv, [64, 3, 2]]     # 4        IR Conv 下采样（from=-4 切换支路）
  - [-1, 1, Conv, [128, 3, 2]]    # 5        IR Conv 下采样
  - [-1, 3, C2f_Faster, [128, True]]  # 6    IR C2f（轻量版）
  - [-1, 1, Conv, [256, 3, 2]]    # 7        IR Conv 下采样（第1个多尺度点）

  # ------------------------------------------------------------------
  # ASSARIFusion_v2 第一处 @ P3/8 (c=128)
  #
  # forward:
  #   rgb, ir = chunk(cat, 2)
  #   delta_rgb = xattn(rgb, ir)               # 交叉注意力
  #   delta_ir  = xattn(ir, rgb)
  #   rgb = rgb + scale_rgb[c] * delta_rgb      # per-channel scale
  #   ir  = ir  + scale_ir[c]  * delta_ir
  #   out = cat([rgb, ir])                      # [B, 256, H/8, W/8]
  #   out = out + post_scale * post_dw(out)     # 深度卷积空间精炼
  #   return out
  # ------------------------------------------------------------------
  - [-3, 1, ASSARIFusion_v2, [64, 8, 2, True]]  # 8

  # ------------------------------------------------------------------
  # Stage 2: P3/8 → P4/16
  # ------------------------------------------------------------------
  - [-4, 6, C2f, [256, True]]     # 9  P3/8  RGB C2f  ← ASSAAdd 输入点1
  - [-1, 1, Conv, [512, 3, 2]]    # 10 P4/16 RGB Conv 下采样
  - [-4, 6, C2f_Faster, [256, True]]  # 11 P3/8  IR C2f   ← ASSAAdd 输入点1
  - [-1, 1, Conv, [512, 3, 2]]    # 12 P4/16 IR Conv 下采样

  # ------------------------------------------------------------------
  # ASSARIFusion_v2 第二处 @ P4/16 (c=256)
  # 同 layer 8，c=256, heads=4
  # ------------------------------------------------------------------
  - [-3, 1, ASSARIFusion_v2, [128, 8, 4, True]]  # 13

  # ------------------------------------------------------------------
  # Stage 3: P4/16 → P5/32
  # ------------------------------------------------------------------
  - [-4, 6, C2f, [512, True]]     # 14 P4/16 RGB C2f  ← ASSAAdd 输入点2
  - [-1, 1, Conv, [1024, 3, 2]]   # 15 P5/32 RGB Conv 下采样
  - [-4, 6, C2f_Faster, [512, True]]  # 16 P4/16 IR C2f  ← ASSAAdd 输入点2
  - [-1, 1, Conv, [1024, 3, 2]]   # 17 P5/32 IR Conv 下采样

  # ------------------------------------------------------------------
  # ASSARIFusion_v2 第三处 @ P5/32 (c=512)
  # 同 layer 8，c=512, heads=4
  # ------------------------------------------------------------------
  - [-3, 1, ASSARIFusion_v2, [256, 8, 4, True]]  # 18

  # ------------------------------------------------------------------
  # Stage 4: SPPF
  # ------------------------------------------------------------------
  - [-4, 3, C2f, [1024, True]]    # 19 P5/32 RGB C2f
  - [-1, 1, SPPF, [1024, 5]]      # 20 P5/32 RGB SPPF ← ASSAAdd 输入点3
  - [-4, 3, C2f_Faster, [1024, True]]  # 21 P5/32 IR C2f
  - [-1, 1, SPPF, [1024, 5]]      # 22 P5/32 IR SPPF  ← ASSAAdd 输入点3

  # ------------------------------------------------------------------
  # 末端融合: ASSAAdd（加法基底 + 交叉注意力残差）
  # 两模态在此合并为单一特征图，之后进入共享的 FPN+PAN
  # ------------------------------------------------------------------
  - [[9, 11], 1, ASSAAdd, [8, 2, True]]    # 23 P3/8  base+attn残差
  - [[14, 16], 1, ASSAAdd, [8, 4, True]]   # 24 P4/16 base+attn残差
  - [[20, 22], 1, ASSAAdd, [8, 4, True]]   # 25 P5/32 base+attn残差

head:
  # FPN (自上而下)
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]       # 26 P5→P4
  - [[-1, 24], 1, Concat, [1]]                        # 27 P4 特征拼接
  - [-1, 3, C2f, [512]]                               # 28 P4 融合
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]       # 29 P4→P3
  - [[-1, 23], 1, Concat, [1]]                        # 30 P3 特征拼接
  - [-1, 3, C2f, [256]]                               # 31 P3 融合（OBB 输入1）

  # PAN (自下而上)
  - [-1, 1, Conv, [256, 3, 2]]                        # 32 P3→P4
  - [[-1, 28], 1, Concat, [1]]                        # 33 P4 特征拼接
  - [-1, 3, C2f, [512]]                               # 34 P4 融合（OBB 输入2）
  - [-1, 1, Conv, [512, 3, 2]]                        # 35 P4→P5
  - [[-1, 25], 1, Concat, [1]]                        # 36 P5 特征拼接
  - [-1, 3, C2f, [1024]]                              # 37 P5 融合（OBB 输入3）

  - [[31, 34, 37], 1, OBB, [nc, 1]]
