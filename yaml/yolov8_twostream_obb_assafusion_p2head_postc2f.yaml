# Ultralytics YOLO, AGPL-3.0 license
# A: 轻量 P2 小目标检测头。P2 使用原双流特征 ADD 后进入 head，P3/P4/P5 保持原 ASSARIFusion。
# 目的：直接提升小目标召回和 IoU50 命中率，不引入额外复杂注意力。

nc: 5
scales:
  s: [0.33, 0.50, 1024]
  m: [0.67, 0.75, 768]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.25, 512]
scale: s

backbone:
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2 RGB
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4 RGB
  - [-1, 3, C2f, [128, True]] # 2 P2/4 RGB
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8 RGB

  - [-4, 1, Conv, [64, 3, 2]] # 4-P1/2 IR
  - [-1, 1, Conv, [128, 3, 2]] # 5-P2/4 IR
  - [-1, 3, C2f_Faster, [128, True]] # 6 P2/4 IR
  - [-1, 1, Conv, [256, 3, 2]] # 7-P3/8 IR

  - [-4, 6, C2f, [256, True]] # 8 P3/8 RGB
  - [-4, 6, C2f_Faster, [256, True]] # 9 P3/8 IR
  - [-3, 1, ASSARIFusion, [256, 8, 4, True]] # 10 P3/8 原 ASSA 融合
  - [-4, 1, Conv, [512, 3, 2]] # 11-P4/16 RGB
  - [-4, 1, Conv, [512, 3, 2]] # 12-P4/16 IR

  - [-4, 6, C2f, [512, True]] # 13 P4/16 RGB
  - [-4, 6, C2f_Faster, [512, True]] # 14 P4/16 IR
  - [-3, 1, ASSARIFusion, [512, 8, 4, True]] # 15 P4/16 原 ASSA 融合
  - [-4, 1, Conv, [1024, 3, 2]] # 16-P5/32 RGB
  - [-4, 1, Conv, [1024, 3, 2]] # 17-P5/32 IR

  - [-4, 3, C2f, [1024, True]] # 18 P5/32 RGB
  - [-4, 3, C2f_Faster, [1024, True]] # 19 P5/32 IR
  - [-4, 1, SPPF, [1024, 5]] # 20 P5/32 RGB
  - [-4, 1, SPPF, [1024, 5]] # 21 P5/32 IR
  - [-3, 1, ASSARIFusion, [1024, 8, 4, True]] # 22 P5/32 原 ASSA 融合

  - [[2, 6], 1, ADD, [1]] # 23 P2 to FPN，RGB/IR 原双流特征直接 ADD
  - [10, 1, ADD, [1]] # 24 P3 to FPN
  - [15, 1, ADD, [1]] # 25 P4 to FPN
  - [22, 1, ADD, [1]] # 26 P5 to FPN

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 27 P5 -> P4
  - [[-1, 25], 1, Concat, [1]] # 28
  - [-1, 3, C2f, [512]] # 29 P4 head
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 30 P4 -> P3
  - [[-1, 24], 1, Concat, [1]] # 31
  - [-1, 3, C2f, [256]] # 32 P3 head
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 33 P3 -> P2
  - [[-1, 23], 1, Concat, [1]] # 34
  - [-1, 1, C2f_Faster, [128]] # 35 P2 head，轻量化以控制计算量
  - [-1, 1, Conv, [256, 3, 2]] # 36 P2 -> P3
  - [[-1, 32], 1, Concat, [1]] # 37
  - [-1, 3, C2f, [256]] # 38 P3 PAN
  - [-1, 1, Conv, [512, 3, 2]] # 39 P3 -> P4
  - [[-1, 29], 1, Concat, [1]] # 40
  - [-1, 3, C2f, [512]] # 41 P4 PAN
  - [-1, 1, Conv, [1024, 3, 2]] # 42 P4 -> P5
  - [[-1, 26], 1, Concat, [1]] # 43
  - [-1, 3, C2f, [1024]] # 44 P5 PAN
  - [[35, 38, 41, 44], 1, OBB, [nc, 1]]
