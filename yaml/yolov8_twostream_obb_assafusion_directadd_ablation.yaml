# Controlled ablation of yolov8_twostream_obb_assafusion.yaml:
# keep the original C2f/C2f_Faster branch refinement path, but feed
# ASSARIFusion-refreshed RGB'/IR' features directly to FPN by ADD.

nc: 5
twostream_backbone_end: 35
scales:
  #n: [0.33, 0.25, 1024]
  s: [0.33, 0.50, 1024]
  m: [0.67, 0.75, 768]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.25, 512]
scale: s

backbone:
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 3, C2f, [128, True]] # 2
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8

  - [-4, 1, Conv, [64, 3, 2]] # 4
  - [-1, 1, Conv, [128, 3, 2]] # 5
  - [-1, 3, C2f_Faster, [128, True]] # 6
  - [-1, 1, Conv, [256, 3, 2]] # 7

  - [-3, 1, ASSARIFusion, [64, 8, 2, True]] # 8
  - [-4, 1, Silence, []] # 9 parser-alignment no-op
  - [-4, 1, Silence, []] # 10 parser-alignment no-op
  - [-4, 1, Silence, []] # 11 RGB' P3/8 direct FPN input
  - [-4, 1, Silence, []] # 12 IR' P3/8 direct FPN input

  - [-4, 6, C2f, [256, True]] # 13 original RGB branch refinement
  - [-1, 1, Conv, [512, 3, 2]] # 14
  - [-4, 6, C2f_Faster, [256, True]] # 15 original IR branch refinement
  - [-1, 1, Conv, [512, 3, 2]] # 16

  - [-3, 1, ASSARIFusion, [128, 8, 4, True]] # 17
  - [-4, 1, Silence, []] # 18 parser-alignment no-op
  - [-4, 1, Silence, []] # 19 parser-alignment no-op
  - [-4, 1, Silence, []] # 20 RGB' P4/16 direct FPN input
  - [-4, 1, Silence, []] # 21 IR' P4/16 direct FPN input

  - [-4, 6, C2f, [512, True]] # 22 original RGB branch refinement
  - [-1, 1, Conv, [1024, 3, 2]] # 23
  - [-4, 6, C2f_Faster, [512, True]] # 24 original IR branch refinement
  - [-1, 1, Conv, [1024, 3, 2]] # 25

  - [-3, 1, ASSARIFusion, [256, 8, 4, True]] # 26
  - [-4, 1, Silence, []] # 27 parser-alignment no-op
  - [-4, 1, Silence, []] # 28 parser-alignment no-op
  - [-4, 1, Silence, []] # 29 RGB' P5/32 direct FPN input
  - [-4, 1, Silence, []] # 30 IR' P5/32 direct FPN input

  - [-4, 3, C2f, [1024, True]] # 31 original RGB P5 refinement, kept as control
  - [-1, 1, SPPF, [1024, 5]] # 32 original RGB SPPF, kept as control
  - [-4, 3, C2f_Faster, [1024, True]] # 33 original IR P5 refinement, kept as control
  - [-1, 1, SPPF, [1024, 5]] # 34 original IR SPPF, kept as control

  - [[11, 12], 1, ADD, [1]] # 35 P3 direct ADD after ASSARIFusion
  - [[20, 21], 1, ADD, [1]] # 36 P4 direct ADD after ASSARIFusion
  - [[29, 30], 1, ADD, [1]] # 37 P5 direct ADD after ASSARIFusion

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 38
  - [[-1, 36], 1, Concat, [1]] # 39
  - [-1, 3, C2f, [512]] # 40
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 41
  - [[-1, 35], 1, Concat, [1]] # 42
  - [-1, 3, C2f, [256]] # 43
  - [-1, 1, Conv, [256, 3, 2]] # 44
  - [[-1, 40], 1, Concat, [1]] # 45
  - [-1, 3, C2f, [512]] # 46
  - [-1, 1, Conv, [512, 3, 2]] # 47
  - [[-1, 37], 1, Concat, [1]] # 48
  - [-1, 3, C2f, [1024]] # 49
  - [[43, 46, 49], 1, OBB, [nc, 1]]
