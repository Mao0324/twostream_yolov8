# YOLOv8 双流 OBB — MPSFusion V3 (backbone 深融合) + ADD (末端简单融合)
#
# V3 修复说明 (V2 仍比 ASSARIFusion 差 0.7 mAP50, 重新分析根因):
#   V2 问题不在 BN 末尾归一化——去掉 BN + scale_mps=1e-2 后仍然差。
#   真正的问题是 signal-processing order 冲突:
#     attention(精, 选择性) → bottleneck(粗, 稠密混合)
#     注意力先做"我只取需要的"选择性过滤, bottleneck 接着做全通道稠密混合,
#     等于把注意力精心筛选的结果重新洗平 —— especially hurts hard classes (van -2.4)
#   V3 修复:
#     1) 交换顺序: bottleneck(粗) → attention(精)
#        "先摆在一起形成联合表征, 再做选择性微调" — 粗→精 互补而非冲突
#     2) 独立 bottleneck_reduction 参数, 默认 4 (2c/4=c/2), 比原来 8 (c/4) 宽一倍
#     3) bottleneck 与 attention 同级 init_scale=1e-3, 不主导初始训练
#
# 架构说明:
#   backbone 内部 3 个 stage (P3/P4/P5) 使用 MPSFusion V3 替换 ASSARIFusion:
#     MPSFusion V3 = Step1(1x1 Conv bottleneck 稠密联合) → Step2(稀疏注意力 选择性修正)
#     - Step 1: Conv(2c→c/2)→BN→SiLU→Conv(c/2→2c)  无末尾 BN
#       "先摆在一起" — RGB/IR 通道在低维空间做直接线性混合, 形成粗粒度联合表征
#     - Step 2: SparseCrossChannelAttention2d, 内部 LayerNorm
#       "再选择性修正" — 在联合表征基础上做稀疏、精细的通道注意力微调
#     顺序: 粗→精 互补; 旧顺序 精→粗 冲突 (稠密混合冲淡精细选择)
#   backbone 末端 (P3/P4/P5) 使用 ADD 简单相加合并两流 → FPN
#
# 对比基线:
#   assarifusion.yaml:  ASSARIFusion(纯稀疏注意力)              + ADD
#   assafusion.yaml:    ASSARIFusion(纯稀疏注意力)              + ASSAAdd (当前最优)
#   PC2f_MPF_yolov8s:   RIFusion(无融合 no-op)                 + ADD
#   本配置:              MPSFusion V3(bottleneck粗→attention精) + ADD
#
# MPSFusion 参数: [c, reduction, heads, norm_attn]
#   c:                    每个模态通道数 (自动推断)
#   reduction:            注意力压缩倍率, xattn_hidden = c//reduction (默认 8)
#   heads:                注意力头数
#   norm_attn:            ReLU 后注意力的归一化
#   bottleneck_reduction: 瓶颈压缩倍率, inner = 2c//bottleneck_reduction (默认 4)

nc: 5
scales:
  #n: [0.33, 0.25, 1024]
  s: [0.33, 0.50, 1024]
  m: [0.67, 0.75, 768]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.25, 512]
scale: s

backbone:
  # ── RGB 流 (C2f, layers 0-3) ──
  - [-1, 1, Conv, [64, 3, 2]]        # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]       # 1-P2/4
  - [-1, 3, C2f, [128, True]]        # 2
  - [-1, 1, Conv, [256, 3, 2]]       # 3-P3/8

  # ── IR 流 (C2f_Faster, layers 4-7) ──
  - [-4, 1, Conv, [64, 3, 2]]        # 4
  - [-1, 1, Conv, [128, 3, 2]]       # 5
  - [-1, 3, C2f_Faster, [128, True]] # 6
  - [-1, 1, Conv, [256, 3, 2]]       # 7

  # ── P3 深融合: MPSFusion (稀疏注意力 + 1x1 Bottleneck 联合混合) ──
  - [-3, 1, MPSFusion, [64, 8, 2, True]]   # 8

  # ── stage 2 独立继续 ──
  - [-4, 6, C2f, [256, True]]        # 9   RGB 继续
  - [-1, 1, Conv, [512, 3, 2]]       # 10
  - [-4, 6, C2f_Faster, [256, True]] # 11  IR 继续
  - [-1, 1, Conv, [512, 3, 2]]       # 12

  # ── P4 深融合: MPSFusion ──
  - [-3, 1, MPSFusion, [128, 8, 4, True]]  # 13

  # ── stage 3 独立继续 ──
  - [-4, 6, C2f, [512, True]]        # 14  RGB 继续
  - [-1, 1, Conv, [1024, 3, 2]]      # 15
  - [-4, 6, C2f_Faster, [512, True]] # 16  IR 继续
  - [-1, 1, Conv, [1024, 3, 2]]      # 17

  # ── P5 深融合: MPSFusion ──
  - [-3, 1, MPSFusion, [256, 8, 4, True]]  # 18

  # ── stage 4 独立继续 ──
  - [-4, 3, C2f, [1024, True]]       # 19  RGB 继续
  - [-1, 1, SPPF, [1024, 5]]         # 20
  - [-4, 3, C2f_Faster, [1024, True]]# 21  IR 继续
  - [-1, 1, SPPF, [1024, 5]]         # 22

  # ── P3/P4/P5 末端融合: ADD 简单相加 ──
  - [[9, 11], 1, ADD, [1]]           # 23  P3
  - [[14, 16], 1, ADD, [1]]          # 24  P4
  - [[20, 22], 1, ADD, [1]]          # 25  P5

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 26
  - [[-1, 24], 1, Concat, [1]]                    # 27
  - [-1, 3, C2f, [512]]                           # 28
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 29
  - [[-1, 23], 1, Concat, [1]]                    # 30
  - [-1, 3, C2f, [256]]                           # 31
  - [-1, 1, Conv, [256, 3, 2]]                    # 32
  - [[-1, 28], 1, Concat, [1]]                    # 33
  - [-1, 3, C2f, [512]]                           # 34
  - [-1, 1, Conv, [512, 3, 2]]                    # 35
  - [[-1, 25], 1, Concat, [1]]                    # 36
  - [-1, 3, C2f, [1024]]                          # 37
  - [[31, 34, 37], 1, OBB, [nc, 1]]               # 38
