# YOLOv8 双流 OBB — MPSFusion V2 (backbone 深融合) + ADD (末端简单融合)
#
# V2 修复说明 (相比 idea.txt 初版):
#   初版 MPSFusion 训练效果反而比 ASSARIFusion 差, 根因有三:
#   1) bottleneck 末尾的 BatchNorm2d 将输出强制归一化为 N(0,1), 再乘以 1e-3 scale,
#      导致 bottleneck 梯度路径完全被 BN 噪声淹没 —— 学不到有用信号
#   2) scale_mps 与 attention 共用同一个 init_scale=1e-3, bottleneck 信号过弱
#   3) 对比 ASSARIFusion 能生效: 它的 xattn 内部用 LayerNorm (不依赖 batch),
#      梯度干净稳定; 而 bottleneck 的 BN 依赖 batch 统计量, 小 batch 下极不稳定
#   V2 修复: 去末尾 BN + scale_mps 独立参数 init 1e-2 (比 attention 大 10 倍)
#
# 架构说明:
#   backbone 内部 3 个 stage (P3/P4/P5) 使用 MPSFusion 替换 ASSARIFusion:
#     MPSFusion = 稀疏交叉注意力 + 1x1 Conv Bottleneck
#     - Step 1: SparseCrossChannelAttention2d —— "我需要你的哪些信息?" (选择性、稀疏)
#                内部使用 LayerNorm, 不依赖 batch, 梯度稳定
#     - Step 2: 1x1 Conv squeeze-BN-SiLU-expand —— "让我们在通道维度直接交互" (稠密、直接)
#                squeeze 后保留 BN 保证中间激活分布稳定; expand 后无 BN,
#                Conv2d 输出量级自然, 由独立的 scale_mps 参数控制 (初始 1e-2)
#     两步串行: 注意力先做选择性信息检索 → bottleneck 再做直接通道混合
#   backbone 末端 (P3/P4/P5) 使用 ADD 简单相加合并两流 → FPN
#
# 对比基线:
#   assarifusion.yaml:  ASSARIFusion(纯稀疏注意力)              + ADD
#   assafusion.yaml:    ASSARIFusion(纯稀疏注意力)              + ASSAAdd
#   PC2f_MPF_yolov8s:   RIFusion(无融合 no-op)                 + ADD  (最简两流基线)
#   本配置:              MPSFusion V2(注意力 + bottleneck)      + ADD
#   预期 mAP50: 应超过 assarifusion 和 assafusion (V1 反超基线的 bug 已修)
#   新增参数量:  ~86K (3×bottleneck Conv 权重, 不含 BN, 相比 ASSARIFusion)
#
# MPSFusion 参数说明:
#   [c, reduction, heads, norm_attn]
#     c:          每个模态的通道数 (自动推断)
#     reduction:  压缩倍率, xattn hidden = c//reduction, bottleneck inner = 2c//reduction
#                 默认 8, 越小越宽 (bottleneck 容量越大)
#     heads:      稀疏注意力头数
#     norm_attn:  ReLU 后是否对注意力做归一化 (除以 sum)

nc: 5
scales:
  #n: [0.33, 0.25, 1024]
  s: [0.33, 0.50, 1024]
  m: [0.67, 0.75, 768]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.25, 512]
scale: s

backbone:
  # ── RGB 流 (C2f, layers 0-3) ──
  - [-1, 1, Conv, [64, 3, 2]]        # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]       # 1-P2/4
  - [-1, 3, C2f, [128, True]]        # 2
  - [-1, 1, Conv, [256, 3, 2]]       # 3-P3/8

  # ── IR 流 (C2f_Faster, layers 4-7) ──
  - [-4, 1, Conv, [64, 3, 2]]        # 4
  - [-1, 1, Conv, [128, 3, 2]]       # 5
  - [-1, 3, C2f_Faster, [128, True]] # 6
  - [-1, 1, Conv, [256, 3, 2]]       # 7

  # ── P3 深融合: MPSFusion (稀疏注意力 + 1x1 Bottleneck 联合混合) ──
  - [-3, 1, MPSFusion, [64, 8, 2, True]]   # 8

  # ── stage 2 独立继续 ──
  - [-4, 6, C2f, [256, True]]        # 9   RGB 继续
  - [-1, 1, Conv, [512, 3, 2]]       # 10
  - [-4, 6, C2f_Faster, [256, True]] # 11  IR 继续
  - [-1, 1, Conv, [512, 3, 2]]       # 12

  # ── P4 深融合: MPSFusion ──
  - [-3, 1, MPSFusion, [128, 8, 4, True]]  # 13

  # ── stage 3 独立继续 ──
  - [-4, 6, C2f, [512, True]]        # 14  RGB 继续
  - [-1, 1, Conv, [1024, 3, 2]]      # 15
  - [-4, 6, C2f_Faster, [512, True]] # 16  IR 继续
  - [-1, 1, Conv, [1024, 3, 2]]      # 17

  # ── P5 深融合: MPSFusion ──
  - [-3, 1, MPSFusion, [256, 8, 4, True]]  # 18

  # ── stage 4 独立继续 ──
  - [-4, 3, C2f, [1024, True]]       # 19  RGB 继续
  - [-1, 1, SPPF, [1024, 5]]         # 20
  - [-4, 3, C2f_Faster, [1024, True]]# 21  IR 继续
  - [-1, 1, SPPF, [1024, 5]]         # 22

  # ── P3/P4/P5 末端融合: ADD 简单相加 ──
  - [[9, 11], 1, ADD, [1]]           # 23  P3
  - [[14, 16], 1, ADD, [1]]          # 24  P4
  - [[20, 22], 1, ADD, [1]]          # 25  P5

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 26
  - [[-1, 24], 1, Concat, [1]]                    # 27
  - [-1, 3, C2f, [512]]                           # 28
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 29
  - [[-1, 23], 1, Concat, [1]]                    # 30
  - [-1, 3, C2f, [256]]                           # 31
  - [-1, 1, Conv, [256, 3, 2]]                    # 32
  - [[-1, 28], 1, Concat, [1]]                    # 33
  - [-1, 3, C2f, [512]]                           # 34
  - [-1, 1, Conv, [512, 3, 2]]                    # 35
  - [[-1, 25], 1, Concat, [1]]                    # 36
  - [-1, 3, C2f, [1024]]                          # 37
  - [[31, 34, 37], 1, OBB, [nc, 1]]               # 38
