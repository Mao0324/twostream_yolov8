# Ultralytics YOLO 🚀, AGPL-3.0 license
# YOLOv8 双流 OBB — MPSFusion V3 (backbone 深融合) + MPSAdd V3 (末端深融合)
#
# V3 修复说明: bottleneck 与 attention 交换顺序 + 独立 bottleneck_reduction=4
# 详见 mpsfusion.yaml 头部注释。
#
# 架构说明:
#   backbone 内部 MPSFusion V3: bottleneck(粗) → attention(精)
#   backbone 末端 MPSAdd V3:     bottleneck(粗) → attention(精) → 降维融合
#   全链路: bottleneck联合 → attention精细化 → FPN
#
# MPSFusion 参数: [c, reduction, heads, norm_attn]
# MPSAdd 参数:     [reduction, heads, norm_attn]  (c 由输入自动推断)

nc: 5
scales:
  n: [0.33, 0.25, 1024]
  s: [0.33, 0.50, 1024]
  m: [0.67, 0.75, 768]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.25, 512]
scale: s

backbone:
  # ── RGB 流 (C2f, layers 0-3) ──
  - [-1, 1, Conv, [64, 3, 2]]        # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]       # 1-P2/4
  - [-1, 3, C2f, [128, True]]        # 2
  - [-1, 1, Conv, [256, 3, 2]]       # 3-P3/8

  # ── IR 流 (C2f_Faster, layers 4-7) ──
  - [-4, 1, Conv, [64, 3, 2]]        # 4
  - [-1, 1, Conv, [128, 3, 2]]       # 5
  - [-1, 3, C2f_Faster, [128, True]] # 6
  - [-1, 1, Conv, [256, 3, 2]]       # 7

  # ── P3 深融合: MPSFusion (稀疏注意力 + 1x1 Bottleneck) ──
  - [-3, 1, MPSFusion, [64, 8, 2, True]]   # 8

  # ── stage 2 独立继续 ──
  - [-4, 6, C2f, [256, True]]        # 9   RGB
  - [-1, 1, Conv, [512, 3, 2]]       # 10
  - [-4, 6, C2f_Faster, [256, True]] # 11  IR
  - [-1, 1, Conv, [512, 3, 2]]       # 12

  # ── P4 深融合: MPSFusion ──
  - [-3, 1, MPSFusion, [128, 8, 4, True]]  # 13

  # ── stage 3 独立继续 ──
  - [-4, 6, C2f, [512, True]]        # 14  RGB
  - [-1, 1, Conv, [1024, 3, 2]]      # 15
  - [-4, 6, C2f_Faster, [512, True]] # 16  IR
  - [-1, 1, Conv, [1024, 3, 2]]      # 17

  # ── P5 深融合: MPSFusion ──
  - [-3, 1, MPSFusion, [256, 8, 4, True]]  # 18

  # ── stage 4 独立继续 ──
  - [-4, 3, C2f, [1024, True]]       # 19  RGB
  - [-1, 1, SPPF, [1024, 5]]         # 20
  - [-4, 3, C2f_Faster, [1024, True]]# 21  IR
  - [-1, 1, SPPF, [1024, 5]]         # 22

  # ── P3/P4/P5 末端深融合: MPSAdd (稀疏注意力 + 1x1 Bottleneck + 降维) ──
  - [[9, 11], 1, MPSAdd, [8, 2, True]]      # 23  P3  两流→单路
  - [[14, 16], 1, MPSAdd, [8, 4, True]]     # 24  P4  两流→单路
  - [[20, 22], 1, MPSAdd, [8, 4, True]]     # 25  P5  两流→单路

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 26
  - [[-1, 24], 1, Concat, [1]]                    # 27
  - [-1, 3, C2f, [512]]                           # 28
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 29
  - [[-1, 23], 1, Concat, [1]]                    # 30
  - [-1, 3, C2f, [256]]                           # 31
  - [-1, 1, Conv, [256, 3, 2]]                    # 32
  - [[-1, 28], 1, Concat, [1]]                    # 33
  - [-1, 3, C2f, [512]]                           # 34
  - [-1, 1, Conv, [512, 3, 2]]                    # 35
  - [[-1, 25], 1, Concat, [1]]                    # 36
  - [-1, 3, C2f, [1024]]                          # 37
  - [[31, 34, 37], 1, OBB, [nc, 1]]               # 38
