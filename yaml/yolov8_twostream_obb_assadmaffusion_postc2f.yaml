# YOLOv8 双流 OBB：ASSA + DMAF 替代差异分支的中间融合版本。
#
# 结构说明：
# - 整体基于 yolov8_twostream_obb_assafusion_postc2f.yaml。
# - RGB 分支仍使用标准 C2f，IR 分支仍使用 C2f_Faster。
# - 在 P3/P4/P5 的 RGB/IR backbone 输出后插入 ASSADMAFFusion。
# - ASSADMAFFusion 内部先使用无参数 DMAF 做 RGB/IR 差异补偿，再使用 ASSA 跨通道注意力增强。
# - 该模块删除 ASSARIFusion 原来的 diff_gate/rgb_diff_proj/ir_diff_proj 可学习差异分支。
# - 三个尺度融合后通过 ADD 合成单流特征，再进入标准 YOLOv8 FPN/PAN 和 OBB 检测头。

nc: 5
scales:
  # n: [0.33, 0.25, 1024]
  s: [0.33, 0.50, 1024]
  m: [0.67, 0.75, 768]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.25, 512]
scale: s

backbone:
  # RGB stem 和 P2/4 特征提取。
  - [-1, 1, Conv, [64, 3, 2]]                    # 0 RGB P1/2
  - [-1, 1, Conv, [128, 3, 2]]                   # 1 RGB P2/4
  - [-1, 3, C2f, [128, True]]                    # 2 RGB P2/4 C2f
  - [-1, 1, Conv, [256, 3, 2]]                   # 3 RGB P3/8 输入

  # IR stem 和 P2/4 特征提取，IR 分支使用 C2f_Faster 降低计算量。
  - [-4, 1, Conv, [64, 3, 2]]                    # 4 IR P1/2
  - [-1, 1, Conv, [128, 3, 2]]                   # 5 IR P2/4
  - [-1, 3, C2f_Faster, [128, True]]             # 6 IR P2/4 C2f_Faster
  - [-1, 1, Conv, [256, 3, 2]]                   # 7 IR P3/8 输入

  # P3/8：RGB/IR 各自提特征后，使用 ASSADMAFFusion 做 DMAF 补偿 + ASSA 注意力融合。
  - [-4, 6, C2f, [256, True]]                    # 8 RGB P3/8
  - [-4, 6, C2f_Faster, [256, True]]             # 9 IR P3/8
  - [-3, 1, ASSADMAFFusion, [256, 8, 4, True]]   # 10 P3/8 ASSA + DMAF 融合
  - [-4, 1, Conv, [512, 3, 2]]                   # 11 RGB P4/16 输入
  - [-4, 1, Conv, [512, 3, 2]]                   # 12 IR P4/16 输入

  # P4/16：中层语义特征融合。
  - [-4, 6, C2f, [512, True]]                    # 13 RGB P4/16
  - [-4, 6, C2f_Faster, [512, True]]             # 14 IR P4/16
  - [-3, 1, ASSADMAFFusion, [512, 8, 4, True]]   # 15 P4/16 ASSA + DMAF 融合
  - [-4, 1, Conv, [1024, 3, 2]]                  # 16 RGB P5/32 输入
  - [-4, 1, Conv, [1024, 3, 2]]                  # 17 IR P5/32 输入

  # P5/32：高层语义特征在 SPPF 后融合。
  - [-4, 3, C2f, [1024, True]]                   # 18 RGB P5/32
  - [-4, 3, C2f_Faster, [1024, True]]            # 19 IR P5/32
  - [-4, 1, SPPF, [1024, 5]]                     # 20 RGB P5/32 SPPF
  - [-4, 1, SPPF, [1024, 5]]                     # 21 IR P5/32 SPPF
  - [-3, 1, ASSADMAFFusion, [1024, 8, 4, True]]  # 22 P5/32 ASSA + DMAF 融合

  # ASSADMAFFusion 输出为 [RGB, IR] concat 特征，这里用 ADD 合成为单流 FPN 输入。
  - [10, 1, ADD, [1]]                            # 23 P3 fused to FPN
  - [15, 1, ADD, [1]]                            # 24 P4 fused to FPN
  - [22, 1, ADD, [1]]                            # 25 P5 fused to FPN

head:
  # 标准 YOLOv8 FPN/PAN neck。
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 26 P5 -> P4
  - [[-1, 24], 1, Concat, [1]]                   # 27 concat P4
  - [-1, 3, C2f, [512]]                          # 28 FPN P4
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 29 P4 -> P3
  - [[-1, 23], 1, Concat, [1]]                   # 30 concat P3
  - [-1, 3, C2f, [256]]                          # 31 FPN P3
  - [-1, 1, Conv, [256, 3, 2]]                   # 32 P3 -> P4
  - [[-1, 28], 1, Concat, [1]]                   # 33 concat PAN P4
  - [-1, 3, C2f, [512]]                          # 34 PAN P4
  - [-1, 1, Conv, [512, 3, 2]]                   # 35 P4 -> P5
  - [[-1, 25], 1, Concat, [1]]                   # 36 concat PAN P5
  - [-1, 3, C2f, [1024]]                         # 37 PAN P5

  # OBB 检测头，输出 DroneVehicle 5 类旋转框。
  - [[31, 34, 37], 1, OBB, [nc, 1]]              # 38 OBB Detect
