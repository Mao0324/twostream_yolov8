# YOLOv8 双流 OBB：在 ASSA baseline 的 RGB/IR backbone 中加入 Dense DualC2fDMAF。
#
# 结构说明：
# - 输入仍为双流 RGB/IR，前两层分别建立 RGB stem 和 IR stem。
# - P2/P3/P4/P5 的原始 RGB C2f 与 IR C2f_Faster 被替换为 DualC2fDMAF。
# - DualC2fDMAF 会把 RGB/IR 拼成 paired tensor，在每个 C2f bottleneck 内插入 DMAF 交互。
# - P3/P4/P5 继续保留 ASSARIFusion，对每个尺度的 paired RGB/IR 特征做一次中间融合增强。
# - ASSARIFusion 输出后用 DualFeatureSelect 重新取出 RGB 与 IR，后面走两套独立 FPN/PAN。
# - 最后 IAFAOBB 接收 RGB P3/P4/P5 与 IR P3/P4/P5，做照明感知对齐融合并完成 OBB 检测。

nc: 5
scales:
  #n: [0.33, 0.25, 1024]
  s: [0.33, 0.50, 1024]
  m: [0.67, 0.75, 768]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.25, 512]
scale: s

backbone:
  # RGB/IR 双流 stem，分别下采样到 P2/4。
  - [-1, 1, Conv, [64, 3, 2]]                    # 0 RGB P1/2
  - [-1, 1, Conv, [128, 3, 2]]                   # 1 RGB P2/4
  - [-4, 1, Conv, [64, 3, 2]]                    # 2 IR P1/2
  - [-1, 1, Conv, [128, 3, 2]]                   # 3 IR P2/4

  # P2/4 paired Dense-DMAF 阶段：RGB/IR 合并为 paired 特征，内部每个 bottleneck 都做 DMAF。
  - [-3, 3, DualC2fDMAF, [128, True]]            # 4 paired P2/4

  # P3/8 paired Dense-DMAF 阶段，并在该尺度后接 ASSARIFusion。
  - [-4, 1, Conv, [256, 3, 2]]                   # 5 RGB P3/8
  - [-4, 1, Conv, [256, 3, 2]]                   # 6 IR P3/8
  - [-3, 6, DualC2fDMAF, [256, True]]            # 7 paired P3/8
  - [-3, 1, ASSARIFusion, [256, 8, 4, True]]     # 8 P3/8 DualC2fDMAF 后 ASSA 融合

  # P4/16 paired Dense-DMAF 阶段，并在该尺度后接 ASSARIFusion。
  - [-4, 1, Conv, [512, 3, 2]]                   # 9 RGB P4/16
  - [-4, 1, Conv, [512, 3, 2]]                   # 10 IR P4/16
  - [-3, 6, DualC2fDMAF, [512, True]]            # 11 paired P4/16
  - [-3, 1, ASSARIFusion, [512, 8, 4, True]]     # 12 P4/16 DualC2fDMAF 后 ASSA 融合

  # P5/32 paired Dense-DMAF 阶段，再分别经过 RGB/IR SPPF，最后接 ASSARIFusion。
  - [-4, 1, Conv, [1024, 3, 2]]                  # 13 RGB P5/32
  - [-4, 1, Conv, [1024, 3, 2]]                  # 14 IR P5/32
  - [-3, 3, DualC2fDMAF, [1024, True]]           # 15 paired P5/32
  - [-4, 1, SPPF, [1024, 5]]                     # 16 RGB P5/32 SPPF
  - [-4, 1, SPPF, [1024, 5]]                     # 17 IR P5/32 SPPF
  - [-3, 1, ASSARIFusion, [1024, 8, 4, True]]    # 18 P5/32 SPPF 后 ASSA 融合

head:
  # 从 ASSARIFusion 增强后的 paired P3/P4/P5 中重新取出 RGB 与 IR。
  # DualFeatureSelect 索引：0 表示 RGB，1 表示 IR。
  - [8, 1, DualFeatureSelect, [0]]                # 19 RGB P3/8
  - [12, 1, DualFeatureSelect, [0]]               # 20 RGB P4/16
  - [18, 1, DualFeatureSelect, [0]]               # 21 RGB P5/32
  - [8, 1, DualFeatureSelect, [1]]                # 22 IR P3/8
  - [12, 1, DualFeatureSelect, [1]]               # 23 IR P4/16
  - [18, 1, DualFeatureSelect, [1]]               # 24 IR P5/32

  # RGB 分支 FPN/PAN：只使用 RGB P3/P4/P5 做自顶向下和自底向上特征聚合。
  - [21, 1, nn.Upsample, [None, 2, "nearest"]]    # 25 RGB P5 -> P4
  - [[-1, 20], 1, Concat, [1]]                    # 26 RGB concat P4
  - [-1, 3, C2f, [512]]                           # 27 RGB FPN P4
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]    # 28 RGB P4 -> P3
  - [[-1, 19], 1, Concat, [1]]                    # 29 RGB concat P3
  - [-1, 3, C2f, [256]]                           # 30 RGB out P3
  - [-1, 1, Conv, [256, 3, 2]]                    # 31 RGB P3 -> P4
  - [[-1, 27], 1, Concat, [1]]                    # 32 RGB concat PAN P4
  - [-1, 3, C2f, [512]]                           # 33 RGB out P4
  - [-1, 1, Conv, [512, 3, 2]]                    # 34 RGB P4 -> P5
  - [[-1, 21], 1, Concat, [1]]                    # 35 RGB concat PAN P5
  - [-1, 3, C2f, [1024]]                          # 36 RGB out P5

  # IR 分支 FPN/PAN：只使用 IR P3/P4/P5 做自顶向下和自底向上特征聚合。
  - [24, 1, nn.Upsample, [None, 2, "nearest"]]    # 37 IR P5 -> P4
  - [[-1, 23], 1, Concat, [1]]                    # 38 IR concat P4
  - [-1, 3, C2f, [512]]                           # 39 IR FPN P4
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]    # 40 IR P4 -> P3
  - [[-1, 22], 1, Concat, [1]]                    # 41 IR concat P3
  - [-1, 3, C2f, [256]]                           # 42 IR out P3
  - [-1, 1, Conv, [256, 3, 2]]                    # 43 IR P3 -> P4
  - [[-1, 39], 1, Concat, [1]]                    # 44 IR concat PAN P4
  - [-1, 3, C2f, [512]]                           # 45 IR out P4
  - [-1, 1, Conv, [512, 3, 2]]                    # 46 IR P4 -> P5
  - [[-1, 24], 1, Concat, [1]]                    # 47 IR concat PAN P5
  - [-1, 3, C2f, [1024]]                          # 48 IR out P5

  # 最终检测头：IAFAOBB 对齐并融合 RGB/IR 三尺度特征，再输出旋转框检测结果。
  - [[30, 33, 36, 42, 45, 48], 1, IAFAOBB, [nc, 1, 8, 4.0, 0.2, 0.35]] # 49
