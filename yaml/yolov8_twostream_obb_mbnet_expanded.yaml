# YOLOv8 two-stream OBB with MBNet-style dense DMAF and IAFA head.
# Expanded YAML layout following yolov8_twostream_obb_assafusion_postc2f.yaml style.
#
# Notes:
# - DualC2fDMAF and DualSPPF are kept as atomic modules because the current
#   two-stream forward path packs RGB/IR features as [B, 2C, H, W] for these
#   layers and unpacks them internally.
# - DualFPN is expanded below as ordinary Upsample/Concat/C2f/Conv layers.

nc: 5
scales:
  #n: [0.33, 0.25, 1024]
  s: [0.33, 0.50, 1024]
  m: [0.67, 0.75, 768]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.25, 512]
scale: s

backbone:
  # -------------------------
  # RGB branch stem, P1-P2
  # -------------------------
  - [-1, 1, Conv, [64, 3, 2]]                    # 0  RGB P1/2
  - [-1, 1, Conv, [128, 3, 2]]                   # 1  RGB P2/4

  # -------------------------
  # IR branch stem, P1-P2
  # -------------------------
  - [-4, 1, Conv, [64, 3, 2]]                    # 2  IR P1/2
  - [-1, 1, Conv, [128, 3, 2]]                   # 3  IR P2/4

  # -------------------------
  # P2/4 dense DMAF stage
  # input/output are packed [RGB, IR] features
  # -------------------------
  - [-3, 3, DualC2fDMAF, [128, True]]            # 4  paired P2/4

  # -------------------------
  # P3/8 downsample + dense DMAF stage
  # -------------------------
  - [-4, 1, Conv, [256, 3, 2]]                   # 5  RGB P3/8
  - [-4, 1, Conv, [256, 3, 2]]                   # 6  IR P3/8
  - [-3, 6, DualC2fDMAF, [256, True]]            # 7  paired P3/8, saved for neck

  # -------------------------
  # P4/16 downsample + dense DMAF stage
  # -------------------------
  - [-4, 1, Conv, [512, 3, 2]]                   # 8  RGB P4/16
  - [-4, 1, Conv, [512, 3, 2]]                   # 9  IR P4/16
  - [-3, 6, DualC2fDMAF, [512, True]]            # 10 paired P4/16, saved for neck

  # -------------------------
  # P5/32 downsample + dense DMAF + dual SPPF stage
  # -------------------------
  - [-4, 1, Conv, [1024, 3, 2]]                  # 11 RGB P5/32
  - [-4, 1, Conv, [1024, 3, 2]]                  # 12 IR P5/32
  - [-3, 3, DualC2fDMAF, [1024, True]]           # 13 paired P5/32
  - [-3, 1, DualSPPF, [1024, 5]]                 # 14 paired P5/32 SPPF, saved for neck

head:
  # -------------------------
  # Select RGB/IR tensors from paired P3/P4/P5 features.
  # DualFeatureSelect index: 0 = RGB, 1 = IR.
  # -------------------------
  - [7, 1, DualFeatureSelect, [0]]               # 15 RGB P3/8
  - [10, 1, DualFeatureSelect, [0]]              # 16 RGB P4/16
  - [14, 1, DualFeatureSelect, [0]]              # 17 RGB P5/32
  - [7, 1, DualFeatureSelect, [1]]               # 18 IR P3/8
  - [10, 1, DualFeatureSelect, [1]]              # 19 IR P4/16
  - [14, 1, DualFeatureSelect, [1]]              # 20 IR P5/32

  # -------------------------
  # RGB FPN/PAN neck, ordinary YOLOv8 layers
  # -------------------------
  - [17, 1, nn.Upsample, [None, 2, "nearest"]]   # 21 RGB P5 -> P4
  - [[-1, 16], 1, Concat, [1]]                   # 22 RGB concat P4
  - [-1, 3, C2f, [512]]                          # 23 RGB FPN P4
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 24 RGB P4 -> P3
  - [[-1, 15], 1, Concat, [1]]                   # 25 RGB concat P3
  - [-1, 3, C2f, [256]]                          # 26 RGB out P3
  - [-1, 1, Conv, [256, 3, 2]]                   # 27 RGB P3 -> P4
  - [[-1, 23], 1, Concat, [1]]                   # 28 RGB concat PAN P4
  - [-1, 3, C2f, [512]]                          # 29 RGB out P4
  - [-1, 1, Conv, [512, 3, 2]]                   # 30 RGB P4 -> P5
  - [[-1, 17], 1, Concat, [1]]                   # 31 RGB concat PAN P5
  - [-1, 3, C2f, [1024]]                         # 32 RGB out P5

  # -------------------------
  # IR FPN/PAN neck, ordinary YOLOv8 layers
  # -------------------------
  - [20, 1, nn.Upsample, [None, 2, "nearest"]]   # 33 IR P5 -> P4
  - [[-1, 19], 1, Concat, [1]]                   # 34 IR concat P4
  - [-1, 3, C2f, [512]]                          # 35 IR FPN P4
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 36 IR P4 -> P3
  - [[-1, 18], 1, Concat, [1]]                   # 37 IR concat P3
  - [-1, 3, C2f, [256]]                          # 38 IR out P3
  - [-1, 1, Conv, [256, 3, 2]]                   # 39 IR P3 -> P4
  - [[-1, 35], 1, Concat, [1]]                   # 40 IR concat PAN P4
  - [-1, 3, C2f, [512]]                          # 41 IR out P4
  - [-1, 1, Conv, [512, 3, 2]]                   # 42 IR P4 -> P5
  - [[-1, 20], 1, Concat, [1]]                   # 43 IR concat PAN P5
  - [-1, 3, C2f, [1024]]                         # 44 IR out P5

  # -------------------------
  # Illumination-aware feature alignment OBB head
  # input order: RGB P3/P4/P5, IR P3/P4/P5
  # args: nc, angle channels, reduction, max offset, illum loss gain, illum threshold
  # -------------------------
  - [[26, 29, 32, 38, 41, 44], 1, IAFAOBB, [nc, 1, 8, 4.0, 0.2, 0.35]] # 45 OBB detect head
