# YOLOv8 two-stream OBB with ASSARIFusion after C2f blocks and P5 SPPF.

nc: 5
scales:
  #n: [0.33, 0.25, 1024]
  s: [0.33, 0.50, 1024]
  m: [0.67, 0.75, 768]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.25, 512]
scale: s

backbone:
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2 RGB
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4 RGB
  - [-1, 3, C2f, [128, True]] # 2 RGB
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8 RGB

  - [-4, 1, Conv, [64, 3, 2]] # 4-P1/2 IR
  - [-1, 1, Conv, [128, 3, 2]] # 5-P2/4 IR
  - [-1, 3, C2f_Faster, [128, True]] # 6 IR
  - [-1, 1, Conv, [256, 3, 2]] # 7-P3/8 IR

  - [-4, 6, C2f, [256, True]] # 8 P3/8 RGB
  - [-4, 6, C2f_Faster, [256, True]] # 9 P3/8 IR
  - [-3, 1, ASSARIFusion, [256, 8, 4, True]] # 10 P3/8 fusion after C2f
  - [-1, 1, Silence, []] # 11 P3/8 IR fused save
  - [-4, 1, Silence, []] # 12 P3/8 RGB fused save
  - [-1, 1, Conv, [512, 3, 2]] # 13-P4/16 RGB
  - [-4, 1, Conv, [512, 3, 2]] # 14-P4/16 IR

  - [-4, 6, C2f, [512, True]] # 15 P4/16 RGB
  - [-4, 6, C2f_Faster, [512, True]] # 16 P4/16 IR
  - [-3, 1, ASSARIFusion, [512, 8, 4, True]] # 17 P4/16 fusion after C2f
  - [-1, 1, Silence, []] # 18 P4/16 IR fused save
  - [-4, 1, Silence, []] # 19 P4/16 RGB fused save
  - [-1, 1, Conv, [1024, 3, 2]] # 20-P5/32 RGB
  - [-4, 1, Conv, [1024, 3, 2]] # 21-P5/32 IR

  - [-4, 3, C2f, [1024, True]] # 22 P5/32 RGB
  - [-4, 3, C2f_Faster, [1024, True]] # 23 P5/32 IR
  - [-4, 1, SPPF, [1024, 5]] # 24 P5/32 RGB
  - [-4, 1, SPPF, [1024, 5]] # 25 P5/32 IR
  - [-3, 1, ASSARIFusion, [1024, 8, 4, True]] # 26 P5/32 fusion after SPPF
  - [-1, 1, Silence, []] # 27 P5/32 IR fused
  - [-4, 1, Silence, []] # 28 P5/32 RGB fused

  - [[12, 11], 1, ADD, [1]] # 29 P3 to FPN
  - [[19, 18], 1, ADD, [1]] # 30 P4 to FPN
  - [[28, 27], 1, ADD, [1]] # 31 P5 to FPN

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 32
  - [[-1, 30], 1, Concat, [1]] # 33
  - [-1, 3, C2f, [512]] # 34
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 35
  - [[-1, 29], 1, Concat, [1]] # 36
  - [-1, 3, C2f, [256]] # 37
  - [-1, 1, Conv, [256, 3, 2]] # 38
  - [[-1, 34], 1, Concat, [1]] # 39
  - [-1, 3, C2f, [512]] # 40
  - [-1, 1, Conv, [512, 3, 2]] # 41
  - [[-1, 31], 1, Concat, [1]] # 42
  - [-1, 3, C2f, [1024]] # 43
  - [[37, 40, 43], 1, OBB, [nc, 1]]
