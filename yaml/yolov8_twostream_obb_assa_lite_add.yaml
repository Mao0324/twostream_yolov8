# Ultralytics YOLO 🚀, AGPL-3.0 license
# YOLOv8 two-stream OBB with ASSARIFusion (intermediate) and plain ADD (terminal).
#
# ============================================================================
# 消融配置: ASSAAdd → ADD（建议1）
# ============================================================================
#
# 【改动点】
#   将 backbone 末端 3 处 ASSAAdd 替换为普通逐元素加法 ADD。
#   ASSARIFusion（中间层交叉注意力融合）保持不变。
#
#   原配置:  ASSAAdd  = 加法基底 + SparseCrossChannelAttention 残差
#           ASSAAdd.forward():
#             base = rgb_feat + ir_feat
#             delta_rgb = xattn(rgb_feat, ir_feat)    # 交叉注意力修正
#             delta_ir  = xattn(ir_feat, rgb_feat)
#             return base + scale * 0.5 * (delta_rgb + delta_ir)
#
#   现配置:  ADD  = torch.add(x[0], x[1]) 纯逐元素加法，无参数
#
# 【预期效果】
#   - 如果 mAP 下降：说明 ASSAAdd 的注意力残差对模态融合有正向贡献，保留
#   - 如果 mAP 不变/微涨：说明 ASSAAdd 冗余，ASSARIFusion 已完成足够的信息交互
#
# 【参数量变化】
#   减少 ~400K（移除 3 个 SparseCrossChannelAttention2d + 3 个可学习 scale）
#   scale=s 下约为：3 × [128²/8 + 256²/8 + 512²/8] ≈ 3 × 131K ≈ 393K
#
# ============================================================================

nc: 7
scales:
  #n: [0.33, 0.25, 1024]
  s: [0.33, 0.50, 1024]
  m: [0.67, 0.75, 768]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.25, 512]
scale: s

backbone:
  # ------------------------------------------------------------------
  # RGB 支路
  # ------------------------------------------------------------------
  - [-1, 1, Conv, [64, 3, 2]]     # 0-P1/2   RGB Conv 下采样
  - [-1, 1, Conv, [128, 3, 2]]    # 1-P2/4   RGB Conv 下采样
  - [-1, 3, C2f, [128, True]]     # 2        RGB C2f
  - [-1, 1, Conv, [256, 3, 2]]    # 3-P3/8   RGB Conv 下采样（第1个多尺度点）

  # ------------------------------------------------------------------
  # IR 支路（from=-4 触发支路切换，从 layer 4 开始使用 IR 输入）
  # ------------------------------------------------------------------
  - [-4, 1, Conv, [64, 3, 2]]     # 4        IR Conv 下采样（from=-4 切换支路）
  - [-1, 1, Conv, [128, 3, 2]]    # 5        IR Conv 下采样
  - [-1, 3, C2f_Faster, [128, True]]  # 6    IR C2f（轻量版）
  - [-1, 1, Conv, [256, 3, 2]]    # 7        IR Conv 下采样（第1个多尺度点）

  # ------------------------------------------------------------------
  # ASSARIFusion 第一处 @ P3/8（from=-3 触发交叉注意力融合）
  # cat([rgb, ir], dim=1) → chunk → xattn(cross) → rgb/ir 残差修正 → cat 返回
  # 融合后两条支路继续独立处理
  # ------------------------------------------------------------------
  - [-3, 1, ASSARIFusion, [64, 8, 2, True]]  # 8

  # ------------------------------------------------------------------
  # Stage 2: P3/8 → P4/16
  # ------------------------------------------------------------------
  - [-4, 6, C2f, [256, True]]     # 9  P3/8  RGB C2f  ← ASSAAdd/ADD 输入点1
  - [-1, 1, Conv, [512, 3, 2]]    # 10 P4/16 RGB Conv 下采样
  - [-4, 6, C2f_Faster, [256, True]]  # 11 P3/8  IR C2f   ← ASSAAdd/ADD 输入点1
  - [-1, 1, Conv, [512, 3, 2]]    # 12 P4/16 IR Conv 下采样

  # ------------------------------------------------------------------
  # ASSARIFusion 第二处 @ P4/16
  # ------------------------------------------------------------------
  - [-3, 1, ASSARIFusion, [128, 8, 4, True]]  # 13

  # ------------------------------------------------------------------
  # Stage 3: P4/16 → P5/32
  # ------------------------------------------------------------------
  - [-4, 6, C2f, [512, True]]     # 14 P4/16 RGB C2f  ← ASSAAdd/ADD 输入点2
  - [-1, 1, Conv, [1024, 3, 2]]   # 15 P5/32 RGB Conv 下采样
  - [-4, 6, C2f_Faster, [512, True]]  # 16 P4/16 IR C2f  ← ASSAAdd/ADD 输入点2
  - [-1, 1, Conv, [1024, 3, 2]]   # 17 P5/32 IR Conv 下采样

  # ------------------------------------------------------------------
  # ASSARIFusion 第三处 @ P5/32
  # ------------------------------------------------------------------
  - [-3, 1, ASSARIFusion, [256, 8, 4, True]]  # 18

  # ------------------------------------------------------------------
  # Stage 4: SPPF
  # ------------------------------------------------------------------
  - [-4, 3, C2f, [1024, True]]    # 19 P5/32 RGB C2f
  - [-1, 1, SPPF, [1024, 5]]      # 20 P5/32 RGB SPPF ← ASSAAdd/ADD 输入点3
  - [-4, 3, C2f_Faster, [1024, True]]  # 21 P5/32 IR C2f
  - [-1, 1, SPPF, [1024, 5]]      # 22 P5/32 IR SPPF  ← ASSAAdd/ADD 输入点3

  # ------------------------------------------------------------------
  # 末端融合: 纯逐元素加法（ADD）
  # 两模态在此合并为单一特征图，之后进入共享的 FPN+PAN
  # ------------------------------------------------------------------
  - [[9, 11], 1, ADD, [1]]        # 23 P3/8   rgb + ir（简单加法）
  - [[14, 16], 1, ADD, [1]]       # 24 P4/16  rgb + ir
  - [[20, 22], 1, ADD, [1]]       # 25 P5/32  rgb + ir

head:
  # FPN (自上而下)
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]       # 26 P5→P4
  - [[-1, 24], 1, Concat, [1]]                        # 27 P4 特征拼接
  - [-1, 3, C2f, [512]]                               # 28 P4 融合
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]       # 29 P4→P3
  - [[-1, 23], 1, Concat, [1]]                        # 30 P3 特征拼接
  - [-1, 3, C2f, [256]]                               # 31 P3 融合（OBB 输入1）

  # PAN (自下而上)
  - [-1, 1, Conv, [256, 3, 2]]                        # 32 P3→P4
  - [[-1, 28], 1, Concat, [1]]                        # 33 P4 特征拼接
  - [-1, 3, C2f, [512]]                               # 34 P4 融合（OBB 输入2）
  - [-1, 1, Conv, [512, 3, 2]]                        # 35 P4→P5
  - [[-1, 25], 1, Concat, [1]]                        # 36 P5 特征拼接
  - [-1, 3, C2f, [1024]]                              # 37 P5 融合（OBB 输入3）

  - [[31, 34, 37], 1, OBB, [nc, 1]]
