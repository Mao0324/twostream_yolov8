# Ultralytics YOLO, AGPL-3.0 license
# Ablation 5: shared-geometry ablation for P3/P4 AR.
# Architecture:
#   P3: GADenseResidualRIFusion, but RGB/IR use independent ARLocal geometry gates.
#   P4: GAASSARIFusion, but RGB/IR use independent ARLocal geometry gates.
#   P5: ASSARIFusion, unchanged sparse high-level fusion.
# Purpose:
#   Compare the proposed shared RGB-IR geometry ctx against independent stream geometry.
#   Independent geometry may fit each modality separately, but can amplify RGB/IR misalignment.
# Key flags:
#   use_affine=True, shared_geometry=False.

nc: 5
scales:
  s: [0.33, 0.50, 1024]
  m: [0.67, 0.75, 768]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.25, 512]
scale: s

backbone:
  - [-1, 1, Conv, [64, 3, 2]]
  - [-1, 1, Conv, [128, 3, 2]]
  - [-1, 3, C2f, [128, True]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [-4, 1, Conv, [64, 3, 2]]
  - [-1, 1, Conv, [128, 3, 2]]
  - [-1, 3, C2f_Faster, [128, True]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [-4, 6, C2f, [256, True]]
  - [-4, 6, C2f_Faster, [256, True]]
  - [-3, 1, GADenseResidualRIFusion, [256, 8, 4, True, 0.001, True, False]] # P3 GADRF, affine, independent geometry
  - [-4, 1, Conv, [512, 3, 2]]
  - [-4, 1, Conv, [512, 3, 2]]
  - [-4, 6, C2f, [512, True]]
  - [-4, 6, C2f_Faster, [512, True]]
  - [-3, 1, GAASSARIFusion, [512, 8, 4, True, 0.001, True, False]] # P4 ARLocal + ASSA, affine, independent geometry
  - [-4, 1, Conv, [1024, 3, 2]]
  - [-4, 1, Conv, [1024, 3, 2]]
  - [-4, 3, C2f, [1024, True]]
  - [-4, 3, C2f_Faster, [1024, True]]
  - [-4, 1, SPPF, [1024, 5]]
  - [-4, 1, SPPF, [1024, 5]]
  - [-3, 1, ASSARIFusion, [1024, 8, 4, True]] # P5 sparse ASSA
  - [10, 1, ADD, [1]]
  - [15, 1, ADD, [1]]
  - [22, 1, ADD, [1]]

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 24], 1, Concat, [1]]
  - [-1, 3, C2f, [512]]
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 23], 1, Concat, [1]]
  - [-1, 3, C2f, [256]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 28], 1, Concat, [1]]
  - [-1, 3, C2f, [512]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 25], 1, Concat, [1]]
  - [-1, 3, C2f, [1024]]
  - [[31, 34, 37], 1, OBB, [nc, 1]]
